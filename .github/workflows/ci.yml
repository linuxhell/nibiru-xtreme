name: CI

on:
  push:
    branches: [main, "chatgpt/**", "claude/amazing-newton-0qce70"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets --all-features
      - uses: actions/setup-python@v5
        if: runner.os == 'Linux'
        with:
          python-version: "3.12"
      - name: Independent BitTorrent interoperability
        if: runner.os == 'Linux'
        run: |
          python -m pip install libtorrent==2.1.1
          cargo build --locked --bin nibiru-xtreme
          python tests/interop_libtorrent.py --binary target/debug/nibiru-xtreme
      - name: Release build
        run: cargo build --locked --release
      - name: Package Windows x64
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./target/release/nibiru-xtreme.exe --version
          if ($LASTEXITCODE -ne 0) { throw "Binary smoke test failed" }
          New-Item -ItemType Directory -Force dist/nibiru-windows-x64 | Out-Null
          Copy-Item target/release/nibiru-xtreme.exe, benchmarks/windows11.ps1, benchmarks/iniciar-teste.cmd, benchmarks/comparar-sync.ps1, benchmarks/comparar-sync.cmd, benchmarks/comparar-adaptativo.cmd, benchmarks/README.md, benchmarks/performance-2026-10-19.md, docs/protocols.md, LICENSE, THIRD_PARTY_NOTICES.md, LICENSE-APACHE-2.0.txt dist/nibiru-windows-x64/
          $hash = (Get-FileHash dist/nibiru-windows-x64/nibiru-xtreme.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  nibiru-xtreme.exe" | Set-Content -Encoding ascii dist/nibiru-windows-x64/SHA256SUMS.txt
      - name: Upload Windows x64
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: nibiru-windows-x64
          path: dist/nibiru-windows-x64/
          if-no-files-found: error
