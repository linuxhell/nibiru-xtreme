name: Release

# Builds the engine for the three desktop targets and, when a tag is given, publishes them as raw
# executables named like the Apocalipse Download Manager's updater expects:
#   nibiru-xtreme-<version>-windows-x64.exe | -linux-x64 | -macos-x64   (+ .sha256 sidecars)

on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Publish a release with this tag (created on the selected commit), e.g. v0.2.0"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-publication
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  publish:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: binaries
          pattern: nibiru-*
      - name: Package verified executables
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          version=$(sed -nE 's/^version *= *"([^"]+)"/\1/p' Cargo.toml | head -1)
          tag="${REQUESTED_TAG:-v$version}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then tag="$GITHUB_REF_NAME"; fi
          test "$tag" = "v$version"
          mkdir -p assets
          for platform in windows-x64 linux-x64 macos-x64; do
            binary=nibiru-xtreme
            suffix="$platform"
            if [ "$platform" = windows-x64 ]; then binary="$binary.exe"; suffix="$suffix.exe"; fi
            name="nibiru-xtreme-$version-$suffix"
            test -s "binaries/nibiru-$platform/$binary"
            cp "binaries/nibiru-$platform/$binary" "assets/$name"
            (cd assets && sha256sum "$name" > "$name.sha256")
          done
          cp LICENSE THIRD_PARTY_NOTICES.md LICENSE-APACHE-2.0.txt assets/
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          TAG="$REQUESTED_TAG"
          if [ -z "$TAG" ]; then
            TAG="v$(sed -nE 's/^version *= *"([^"]+)"/\1/p' Cargo.toml | head -1)"
          fi
          flags=""
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          gh release create "$TAG" assets/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Nibiru Xtreme $TAG" --notes-file RELEASE_NOTES.md $flags
