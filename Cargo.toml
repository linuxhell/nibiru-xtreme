[package]
name = "nibiru-xtreme"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "Lightweight, secure and high-performance download engine"
repository = "https://github.com/linuxhell/nibiru-xtreme"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
opt-level = 3

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
bytes = "1"
h2 = "0.4"
http = "1"
